name: 💡 Feature request
description: An idea to make Phage better? Tell us your use case.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Vote with 👍 on issues you want — no `+1` comments. Scoring: `score = 👍 + 3 × verified sponsors` (see [ROADMAP.md](../../blob/main/ROADMAP.md)). Sponsors: comment `sponsor-vote` to get your +3 counted.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that Phage doesn't handle (yet)?
      placeholder: "When I ..., I wish Phage would ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? (Optional — the use case matters most.)
  - type: input
    id: area
    attributes:
      label: Area
      description: Which part of Phage? Keep one of these values so triage stays clean (field stays free-text so the Phage app can pre-fill it): CLI, GUI / Dashboard, PHP versions, Databases, Debugger / Profiler, Sharing / Tunnels, Mail, Docs / Translations, Other.
      placeholder: "e.g. CLI, GUI / Dashboard, PHP versions, Databases, Debugger / Profiler, Sharing / Tunnels, Mail, Docs / Translations, Other"
